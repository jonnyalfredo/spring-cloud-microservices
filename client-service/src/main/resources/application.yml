server:
  port: 8081

spring:
  application:
    name: client-api

  datasource:
    url: jdbc:h2:mem:clientdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    enabled: false

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8080
