services:

  postgres-client:
    image: postgres:15
    container_name: postgres-client
    environment:
      POSTGRES_DB: ${CLIENT_DB_NAME:?Set CLIENT_DB_NAME in .env}
      POSTGRES_USER: ${CLIENT_DB_USER:?Set CLIENT_DB_USER in .env}
      POSTGRES_PASSWORD: ${CLIENT_DB_PASSWORD:?Set CLIENT_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_client_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vitrine-network

  postgres-order:
    image: postgres:15
    container_name: postgres-order
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:?Set ORDER_DB_NAME in .env}
      POSTGRES_USER: ${ORDER_DB_USER:?Set ORDER_DB_USER in .env}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vitrine-network

  service-registry:
    build: ./service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - vitrine-network

  client-api:
    build: ./client-service
    container_name: client-api
    depends_on:
      postgres-client:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-client:5432/${CLIENT_DB_NAME:?Set CLIENT_DB_NAME in .env}
      SPRING_DATASOURCE_USERNAME: ${CLIENT_DB_USER:?Set CLIENT_DB_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${CLIENT_DB_PASSWORD:?Set CLIENT_DB_PASSWORD in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:?Set EUREKA_DEFAULT_ZONE in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/clients/public/test || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - vitrine-network

  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      postgres-order:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      client-api:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/${ORDER_DB_NAME:?Set ORDER_DB_NAME in .env}
      SPRING_DATASOURCE_USERNAME: ${ORDER_DB_USER:?Set ORDER_DB_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:?Set EUREKA_DEFAULT_ZONE in .env}
      CLIENT_SERVICE_URL: ${CLIENT_SERVICE_URL:?Set CLIENT_SERVICE_URL in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8083/orders/public/test || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - vitrine-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      service-registry:
        condition: service_healthy
      client-api:
        condition: service_healthy
      order-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:?Set EUREKA_DEFAULT_ZONE in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - vitrine-network

volumes:
  postgres_client_data:
  postgres_order_data:

networks:
  vitrine-network:
    driver: bridge
