version: '3.8'

services:

  postgres-client:
    image: postgres:15
    container_name: postgres-client
    environment:
      POSTGRES_DB: clientdb
      POSTGRES_USER: clientuser
      POSTGRES_PASSWORD: clientpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_client_data:/var/lib/postgresql/data
    networks:
      - vitrine-network

  postgres-order:
    image: postgres:15
    container_name: postgres-order
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    ports:
      - "5434:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    networks:
      - vitrine-network

  service-registry:
    build: ./service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    networks:
      - vitrine-network

  client-api:
    build: ./client-api
    container_name: client-api
    depends_on:
      - postgres-client
      - service-registry
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
    networks:
      - vitrine-network

  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      - postgres-order
      - service-registry
      - client-api
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
    networks:
      - vitrine-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - service-registry
      - client-api
      - order-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
    networks:
      - vitrine-network

volumes:
  postgres_client_data:
  postgres_order_data:

networks:
  vitrine-network:
    driver: bridge