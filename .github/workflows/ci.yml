name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  maven-test:
    name: Maven test - ${{ matrix.module }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - client-service
          - order-service
          - api-gateway
          - service-registry

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      - name: Run Maven tests
        working-directory: ${{ matrix.module }}
        run: mvn --batch-mode clean test

  docker-build:
    name: Docker build - ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: maven-test

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: client-service
            image: spring-cloud-microservices/client-service
          - module: order-service
            image: spring-cloud-microservices/order-service
          - module: api-gateway
            image: spring-cloud-microservices/api-gateway
          - module: service-registry
            image: spring-cloud-microservices/service-registry

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ matrix.image }}:ci ./${{ matrix.module }}
